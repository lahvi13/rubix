<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Rewritten from the chosen theme before the first paint (lib/appearance.ts);
         the value here is only what a light-theme reader would see flash. -->
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="A free timer and trainer for the 3×3 cube: a beginner's guide, F2L, OLL and PLL drills, and solves timed phase by phase. Works offline, no account."
    />
    <title>Rubix</title>

    <!--
      What a shared link is shown with (Reddit, Discord, messengers). The image
      and page URLs have to be absolute — crawlers do not resolve relative ones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rubix" />
    <meta property="og:title" content="Rubix — cube timer and trainer" />
    <meta
      property="og:description"
      content="A free timer and trainer for the 3×3 cube: a beginner's guide, F2L, OLL and PLL drills, and solves timed phase by phase. Works offline, no account."
    />
    <meta property="og:url" content="https://rubix.aix.cz/" />
    <meta property="og:image" content="https://rubix.aix.cz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      iOS reads almost none of the web app manifest. Without these it puts a
      screenshot of the page on the home screen and opens the app in a Safari
      tab, manifest or no manifest. The icons have to be PNGs of their own: an
      SVG favicon is ignored, and so are the manifest's icons.

      The status bar is deliberately not 'black-translucent'. That style hands
      the app the strip behind the clock and battery — and always draws them in
      white, which is unreadable on the light theme. Left opaque, iOS fills it
      from the page background, which is themed.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rubix" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "dd4d5b2fd4ea4baaa7b7d8b4e4a21555", "spa": true}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
