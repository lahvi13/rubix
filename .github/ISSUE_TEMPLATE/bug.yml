name: Bug report
description: Something in Rubix does not work the way it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: At the bottom of the About screen, e.g. `1.12.0·bec6b29`. The link from the app fills it in.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 8, Chrome 140 / iPhone 15, iOS 18 / Windows, Firefox
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Installed on the home screen / as an app
        - In a browser tab
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps that lead to the problem, as exactly as you can.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps a lot.
    validations:
      required: true
